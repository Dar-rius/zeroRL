name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  cpu-tests:
    name: CPU Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run CPU Tests
        run: uv run pytest tests/ -m "not gpu" --cov=zerorl

  gpu-execution:
    name: GPU Integration Tests
    needs: cpu-tests
    runs-on: [self-hosted, gpu, jetson]
    environment: gpu-cluster # Corrigé : au bon niveau !
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run GPU Tests in Container
        run: |
          docker run --rm --gpus all \
          -v ${{ github.workspace }}:/workspace -w /workspace \
          nvcr.io/nvidia/pytorch:26.02-py3 \
          bash -c "uv sync --all-extras --dev && uv run pytest tests/ -m 'gpu'"
