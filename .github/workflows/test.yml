name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cpu-checks:
    name: Check code Quality and run some tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    steps:
      - name: Check code quality
        uses: actions/checkout@v6

      - name: Configure for python ${{matrix.python-version}}
        uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python-version}}

      - name: Install uv and dependancies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          uv pip install --system ruff mypy pytest

      - name: unit test run in cpu
        run: |
          pytest tests/test_common.py tests/test_env.py

  gpu-execution:
    name: Run tests in GPU
    needs: cpu-checks
    runs-on: [self-hosted, jetson, gpu]
    environment: jetson-execution

    steps:
      - name: checkout in GPU
        uses: actions/checkout@v6

      - name: run test
        runs: |
          docker run --rm --gpus all \
          -v ${{github.workspace}}:/workspace -w /workspace \
          nvcr.io/nvidia/pytorch:25.08-py3 \
          bash -c "pip install -r requirements.txt && pytest"
