name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  cpu-tests:
    name: CPU Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run CPU Tests
        run: uv run pytest tests/ -m "not gpu" --cov=zerorl

  gpu-execution:
    name: GPU Integration Tests
    needs: cpu-tests
    runs-on: [self-hosted, gpu, jetson]
    environment: gpu-cluster
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v10
        
      - name: Sync dependencies
        # uv va installer les paquets directement dans le système du Jetson
        run: uv sync --dev

      - name: Run GPU Tests
        run: uv run pytest tests/ -m "gpu"
